<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - ALAS</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>

  <body>
    <div class="container">
      <div class="left">
        <div class="header-content">
          <img src="{{ url_for('static', path='img/logoPTIT.png') }}" alt="logoPTIT" />
          <h2>Đặt lại mật khẩu</h2>
          <p>Tạo mật khẩu mới cho tài khoản của bạn.</p>
        </div>

        {% if error %}
        <div class="form-message error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="form-message success">{{ message }}</div>
        <p class="login-link">
          <a href="/">Quay lại đăng nhập</a>
        </p>
        {% elif token %}
        <form action="/reset-password" method="POST">
          <input type="hidden" name="token" value="{{ token }}">

          <div class="input-group">
            <input type="password" name="password" placeholder="Mật khẩu mới" required />
          </div>

          <div class="input-group">
            <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required />
          </div>

          <button type="submit" class="btn-login">Đổi mật khẩu</button>
        </form>
        {% else %}
        <p class="login-link">
          <a href="/forgot-password">Gửi lại link đặt lại mật khẩu</a>
        </p>
        {% endif %}
      </div>

      <div class="right">
        <img src="{{ url_for('static', path='img/login.png') }}" alt="education" />
      </div>
    </div>
  </body>
</html>
