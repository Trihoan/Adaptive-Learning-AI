<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - ALAS</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>

  <body>
    <div class="container">
      <div class="left">
        <div class="header-content">
          <img src="{{ url_for('static', path='img/logoPTIT.png') }}" alt="logoPTIT" />
          <h2>Quên mật khẩu</h2>
          <p>Nhập email đã liên kết với tài khoản của bạn.</p>
        </div>

        {% if message %}
        <div class="form-message success">{{ message }}</div>
        {% endif %}

        <form action="/forgot-password" method="POST">
          <div class="input-group">
            <input type="email" name="email" placeholder="Email" required />
          </div>

          <button type="submit" class="btn-login">Gửi link đặt lại</button>
        </form>

        <p class="login-link">
          <a href="/">Quay lại đăng nhập</a>
        </p>
      </div>

      <div class="right">
        <img src="{{ url_for('static', path='img/login.png') }}" alt="education" />
      </div>
    </div>
  </body>
</html>
