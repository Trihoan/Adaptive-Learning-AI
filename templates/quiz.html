<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Quiz - {{ topic }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/quiz.css') }}">
    <script src="https://kit.fontawesome.com/ca2ad9c616.js"></script>
</head>

<body>

    <div class="header">
        <div class="logo">Adaptive Learning AI</div>
        <div class="user">
            Hoang Kien <i class="fa-regular fa-circle-user avatar"></i>
        </div>
    </div>

    <div class="quiz-container">
        <form id="quizForm" method="POST" action="/result" style="display:flex; gap:40px; width:100%;">

            <!-- LEFT SIDE: QUESTIONS -->
            <div class="quiz-left">
                <div class="quiz-title">
                    Chủ đề: {{ topic|capitalize }}
                </div>
                <div class="quiz-time">
                    Thời gian: 10:00
                </div>

                {% for q in questions %}
                <div class="question" id="{{ q.id }}" style="display: none;">
                    <p><b>Câu {{ loop.index }}:</b> {{ q.text }}</p>

                    <label>
                        <input type="radio" name="{{ q.id }}" value="A" onclick="answerQuestion({{ loop.index }})">
                        A. {{ q.A }}
                    </label>

                    <label>
                        <input type="radio" name="{{ q.id }}" value="B" onclick="answerQuestion({{ loop.index }})">
                        B. {{ q.B }}
                    </label>

                    <label>
                        <input type="radio" name="{{ q.id }}" value="C" onclick="answerQuestion({{ loop.index }})">
                        C. {{ q.C }}
                    </label>

                    {% if q.D %}
                    <label>
                        <input type="radio" name="{{ q.id }}" value="D" onclick="answerQuestion({{ loop.index }})">
                        D. {{ q.D }}
                    </label>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <!-- RIGHT SIDE: NAVIGATION -->
            <div class="quiz-right">
                <h3>Danh sách câu hỏi</h3>
                <div class="question-grid">
                    {% for q in questions %}
                    <div class="qbox" id="box{{ loop.index }}" onclick="showQuestion({{ loop.index }})">
                        {{ "%02d"|format(loop.index) }}
                    </div>
                    {% endfor %}
                </div>

                <button type="button" class="submit-btn" onclick="submitQuiz()">
                    Nộp bài
                </button>
            </div>

        </form>
    </div>

    <script>
        /* HIỂN THỊ 1 CÂU HỎI */
        function showQuestion(num) {
            let questions = document.querySelectorAll(".question");
            questions.forEach(q => {
                q.style.display = "none";
            });
            
            // Lấy câu hỏi thứ n (num bắt đầu từ 1)
            let target = questions[num - 1];
            if (target) {
                target.style.display = "block";
            }
        }

        /* CHỌN ĐÁP ÁN → Ô SỐ CHUYỂN XANH */
        function answerQuestion(num) {
            let box = document.getElementById("box" + num);
            box.style.background = "#4CAF50";
            box.style.color = "white";
        }

        /* NỘP BÀI */
        function submitQuiz() {
            let confirmSubmit = confirm("Bạn có chắc muốn nộp bài?");
            if (confirmSubmit) {
                document.getElementById("quizForm").submit();
            }
        }

        /* HIỂN THỊ CÂU 1 MẶC ĐỊNH */
        window.onload = function () {
            showQuestion(1);
        }
    </script>

</body>

</html>
