<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa thông tin cá nhân</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/profile.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/edit_profile.css') }}?v=1">
    <script src="https://kit.fontawesome.com/ca2ad9c616.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="header">
        <div class="logo">
             <a href="{{ url_for('home_page') }}">Adaptive Learning AI</a>
        </div>
        <div class="user">
            {{ user_fullname }}
            <i class="fa-regular fa-circle-user avatar"></i>
            <div id="user-menu" class="user-menu">
                <div class="menu-item" onclick="goProfile()">Thông tin cá nhân</div>
                {% if is_admin %}
                <div class="menu-item" onclick="location.href='/admin/users'" style="color: blue; font-weight: bold;">Quản lý sinh viên</div>
                {% endif %}
                <div class="menu-item logout" onclick="logout()">Đăng xuất</div>
            </div>
        </div>
    </div>

    <div class="profile-container edit-profile-container">
        <div class="profile-header">
            <i class="fa-regular fa-circle-user profile-avatar"></i>
            <h2>Chỉnh sửa thông tin</h2>
        </div>

        <form action="/profile/update" method="POST" class="profile-edit-form standalone">
            {% if error %}
            <div class="profile-alert error">{{ error }}</div>
            {% endif %}

            <div class="profile-info edit-profile-info">
                <label class="edit-info-group">
                    <span class="info-label">Mã sinh viên:</span>
                    <input type="text" value="{{ user.maSV }}" readonly>
                </label>

                <label class="edit-info-group">
                    <span class="info-label">Tên đăng nhập:</span>
                    <input type="text" value="{{ user.tenDangNhap }}" readonly>
                </label>

                <label class="edit-info-group">
                    <span class="info-label">Vai trò:</span>
                    <input type="text" value="{{ 'Quản trị viên' if user.role == 'admin' else 'Sinh viên' }}" readonly>
                </label>

                <label class="edit-info-group email-field">
                    <span class="info-label">Email:</span>
                    <input type="email" name="email" value="{{ user.email or '' }}" placeholder="Nhập email để dùng khôi phục mật khẩu" required>
                </label>
            </div>

            <div class="profile-actions">
                <a href="/profile" class="cancel-profile-btn">Hủy bỏ</a>
                <button type="submit" class="save-profile-btn">Lưu thay đổi</button>
            </div>
        </form>
    </div>

    <script>
        document.querySelector(".user").addEventListener("click", function(e) {
            e.stopPropagation();
            const menu = document.getElementById("user-menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", function() {
            const menu = document.getElementById("user-menu");
            if (menu) menu.style.display = "none";
        });

        function goProfile() {
            window.location.href = "/profile";
        }

        function logout() {
            document.cookie = "user_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "/";
        }
    </script>
</body>
</html>
