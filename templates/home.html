<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ALAS - Home</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/AI.css') }}">
    <script src="https://kit.fontawesome.com/ca2ad9c616.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
             <a href="{{ url_for('home_page') }}">Adaptive Learning AI</a>
        </div>
        <div class="user">
            {{ user_fullname }}
            <i class="fa-regular fa-circle-user avatar"></i>
        </div>
    </div>

    <!-- SUBJECT LIST -->
    <div class="subjects">
        <div id="triethoc" class="subject" onclick="showChapters('triethoc')">Triết học Mác - Lênin</div>
        <div id="xahoi" class="subject" onclick="showChapters('xahoi')">Chủ nghĩa xã hội khoa học</div>
    </div>

    <!-- EXERCISE LIST -->
    <div id="chapter-list" class="exercise"></div>

    <!-- CHATBOT WIDGET -->
    <div id="chat-container">
        <div id="chat-header">
            AI Assistant
            <span onclick="toggleChat()" style="float:right; cursor:pointer;">×</span>
        </div>
        <div id="chat-body">
            <div class="bot-msg">Chào bạn! Tôi là AI cố vấn học tập. Bạn cần tôi tư vấn về lộ trình học hay chương tiếp theo không?</div>
        </div>
        <div id="chat-footer">
            <input type="text" id="chat-input" placeholder="Hỏi AI về lộ trình học...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>
    <div id="chat-bubble" onclick="toggleChat()">
        <i class="fa-solid fa-robot"></i>
    </div>

    <script>
        /* LOGIC CHATBOT */
        function toggleChat() {
            const chat = document.getElementById("chat-container");
            chat.style.display = chat.style.display === "flex" ? "none" : "flex";
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const body = document.getElementById("chat-body");
            const text = input.value.trim();
            if (!text) return;

            body.innerHTML += `<div class="user-msg">${text}</div>`;
            input.value = "";
            body.scrollTop = body.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                body.innerHTML += `<div class="bot-msg">${data.reply}</div>`;
                body.scrollTop = body.scrollHeight;
            } catch (e) {
                body.innerHTML += `<div class="bot-msg">Lỗi kết nối server!</div>`;
            }
        }
        
        document.getElementById("chat-input").addEventListener("keypress", (e) => {
            if(e.key === "Enter") sendMessage();
        });
    </script>

    <!-- DỮ LIỆU THỐNG KÊ TỪ DATABASE -->
    <script id="db-stats" type="application/json">
        {{ db_stats | tojson | safe }}
    </script>

    <script>
        // Đọc thống kê thực tế
        const dbStats = JSON.parse(document.getElementById('db-stats').textContent || '{}');

        /* DỮ LIỆU CẤU TRÚC ĐỀ */
        const courses = {
            triethoc: [
                { title: "Đề số 1: Tổng hợp Triết học", topic: "de_triet_1" },
                { title: "Đề số 2: Nguồn gốc và bản chất", topic: "nguon_goc" },
                { title: "Đề số 3: Phép biện chứng", topic: "ban_chat" }
            ],
            xahoi: [
                { title: "Đề số 1: Chương 1", topic: "Chương 1" },
                { title: "Đề số 2: Chương 2", topic: "Chương 2" },
                { title: "Đề số 3: Chương 3", topic: "Chương 3" },
                { title: "Đề số 4: Chương 4", topic: "Chương 4" },
                { title: "Đề số 5: Chương 5", topic: "Chương 5" },
                { title: "Đề số 6: Chương 6", topic: "Chương 6" },
                { title: "Đề số 7: Chương 7", topic: "Chương 7" },
                { title: "Đề số 8: Ôn tập tổng hợp 1", topic: "Tổng hợp 1 " },
                { title: "Đề số 9: Ôn tập tổng hợp 2", topic: "Tổng hợp 2" },
                { title: "Đề số 10: Ôn tập tổng hợp 3", topic: "Tổng hợp 3" },
                { title: "Đề số 11: Ôn tập tổng hợp 4", topic: "Tổng hợp 4" }
            ]
        };

        function showChapters(course) {
            let html = "<h3>Danh sách bài luyện tập</h3>";
            courses[course].forEach(ex => {
                // Lấy dữ liệu thực tế từ stats, nếu chưa làm thì để mặc định 0
                let stat = dbStats[ex.topic] || { count: 0, time: "0 phút" };
                
                // Xác định số câu hỏi dựa trên topic (logic tương ứng QuizService)
                let qCount = 10;
                if (ex.topic.startsWith("cnx_th")) qCount = 60;
                else if (ex.topic.startsWith("cnx_c")) qCount = 40;
                else if (ex.topic.startsWith("de_")) qCount = 20;

                let action = "";
                if (stat.count == 0) {
                    action = `<div class="status not-start" onclick="goQuiz('${ex.topic}')" style="cursor:pointer">Chưa làm</div>`;
                } else {
                    action = `<button class="review-btn" onclick="goQuiz('${ex.topic}')">Làm lại</button>`;
                }

                html += `
                    <div class="exercise-item">
                        <div class="exercise-info">
                            <div class="title">${ex.title}</div>
                            <div class="meta">Tổng thời gian làm bài: ${stat.time} &nbsp;&nbsp; ${stat.count} lần nộp bài &nbsp;&nbsp; ${qCount} câu hỏi</div>
                        </div>
                        <div class="exercise-action">${action}</div>
                    </div>`;
            });
            document.getElementById("chapter-list").innerHTML = html;
            let subjects = document.querySelectorAll(".subject");
            subjects.forEach(sub => sub.classList.remove("active"));
            document.getElementById(course).classList.add("active");
        }

        function goQuiz(topic) { window.location.href = "/quiz?topic=" + topic; }
        window.onload = function () { showChapters("triethoc"); }
    </script>

</body>
</html>
