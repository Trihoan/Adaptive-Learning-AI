<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAS - Home</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/AI.css') }}">
    <script src="https://kit.fontawesome.com/ca2ad9c616.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
             <a href="{{ url_for('home_page') }}">Adaptive Learning AI</a>
        </div>
        <div class="user">
            {{ user_fullname }}
            <i class="fa-regular fa-circle-user avatar"></i>
            <div id="user-menu" class="user-menu">
                <div class="menu-item" onclick="goProfile()">Thông tin cá nhân</div>
                <div class="menu-item menu-item-special" onclick="location.href='/competency-map'">
                    Bản đồ năng lực
                </div>
                {% if is_admin %}
                <div class="menu-item menu-item-admin" onclick="location.href='/admin/users'">Quản lý</div>
                {% endif %}
                <div class="menu-item logout" onclick="logout()">Đăng xuất</div>
            </div>
        </div>
    </div>

    <!-- SUBJECT LIST -->
    <div class="subjects" id="subject-list">
        <!-- Sẽ được load động bằng JS -->
    </div>

    <!-- EXERCISE LIST -->
    <div id="chapter-list" class="exercise"></div>

    <!-- CHATBOT WIDGET -->
    <div id="chat-container">
        <div id="chat-header">
            AI Assistant
            <span onclick="toggleChat()" style="float:right; cursor:pointer;">×</span>
        </div>
        <div id="chat-body">
            <div class="bot-msg">Chào bạn! Tôi là AI cố vấn học tập. Bạn cần tôi tư vấn về lộ trình học hay chương tiếp theo không?</div>
        </div>
        <div id="chat-footer">
            <input type="text" id="chat-input" placeholder="Hỏi AI về lộ trình học...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>
    <div id="chat-bubble" onclick="toggleChat()">
        <i class="fa-solid fa-robot"></i>
    </div>

    <script>
        /* LOGIC CHATBOT */
        function toggleChat() {
            const chat = document.getElementById("chat-container");
            chat.style.display = chat.style.display === "flex" ? "none" : "flex";
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const body = document.getElementById("chat-body");
            const text = input.value.trim();
            if (!text) return;

            body.innerHTML += `<div class="user-msg">${text}</div>`;
            input.value = "";
            body.scrollTop = body.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                body.innerHTML += `<div class="bot-msg">${data.reply}</div>`;
                body.scrollTop = body.scrollHeight;
            } catch (e) {
                body.innerHTML += `<div class="bot-msg">Lỗi kết nối server!</div>`;
            }
        }
        
        document.getElementById("chat-input").addEventListener("keypress", (e) => {
            if(e.key === "Enter") sendMessage();
        });

        /* LOGIC MENU NGƯỜI DÙNG */
        document.querySelector(".user").addEventListener("click", function(e) {
            e.stopPropagation();
            const menu = document.getElementById("user-menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", function() {
            const menu = document.getElementById("user-menu");
            if (menu) menu.style.display = "none";
        });

        function goProfile() {
            // Chuyển hướng đến trang thông tin cá nhân (nếu có)
            window.location.href = "/profile";
        }

        function logout() {
            // Xóa cookie, xóa bộ nhớ tạm và quay về trang login
            localStorage.clear();
            document.cookie = "user_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "/";
        }
    </script>

    <!-- DỮ LIỆU ĐỘNG TỪ DATABASE -->
    <script id="dynamic-courses" type="application/json">
        {{ dynamic_courses | tojson | safe }}
    </script>

    <script id="db-stats" type="application/json">
        {{ db_stats | tojson | safe }}
    </script>

    <script>
        // Đọc dữ liệu từ backend
        const dynamicCourses = JSON.parse(document.getElementById('dynamic-courses').textContent || '{}');
        const dbStats = JSON.parse(document.getElementById('db-stats').textContent || '{}');
        const draftPrefix = "alas_quiz_draft_";
        let cloudDrafts = {}; // Lưu trữ bản nháp từ server

        async function loadCloudDrafts() {
            try {
                // Ta có thể tạo 1 API lấy tất cả draft của user hoặc lấy từng cái
                // Để đơn giản, ta sẽ lấy danh sách topic từ dynamicCourses và fetch
                const topics = [];
                Object.values(dynamicCourses).forEach(course => {
                    course.forEach(ex => topics.push(ex.topic));
                });

                // Gọi đồng thời để tối ưu
                const promises = topics.map(async (topic) => {
                    const res = await fetch("/api/exams/draft/get/" + encodeURIComponent(topic));
                    const data = await res.json();
                    if (data.status === "success") {
                        cloudDrafts[topic] = data.data;
                    }
                });
                await Promise.all(promises);
                
                // Sau khi load xong cloud drafts, render lại giao diện
                showChapters(getActiveCourse());
            } catch (e) { console.error("Load Cloud Drafts Error:", e); }
        }

        function getDraft(topic) {
            // Ưu tiên bản nháp từ Cloud (Cross-browser)
            if (cloudDrafts[topic]) return cloudDrafts[topic];

            try {
                const draft = JSON.parse(localStorage.getItem(draftPrefix + topic) || "null");
                if (!draft || (!Array.isArray(draft.questionIds) && !Array.isArray(draft.question_ids))) return null;
                return draft;
            } catch (e) {
                return null;
            }
        }

        function clearDraft(topic) {
            localStorage.removeItem(draftPrefix + topic);
            // Xóa cả trên Cloud
            fetch("/api/exams/draft/delete/" + encodeURIComponent(topic), { method: "DELETE" });
        }

        function escapeTopic(topic) {
            return encodeURIComponent(topic);
        }

        function showChapters(courseId) {
            const courseData = dynamicCourses[courseId] || [];
            let html = `<h3>Danh sách bài luyện tập - ${courseId}</h3>`;
            
            if (courseData.length === 0) {
                html += "<p style='padding: 20px; color: #666;'>Chưa có dữ liệu bài tập cho môn học này.</p>";
            }

            courseData.forEach((ex, index) => {
                let stat = dbStats[ex.topic] || { count: 0, time: "0 phút" };
                let draft = getDraft(ex.topic);
                
                // Tiêu đề hiển thị
                let displayTitle = ex.is_general ? ex.title : `Bài luyện tập: ${ex.title}`;
                let qCount = ex.is_general ? 60 : 40;

                let action = "";
                if (draft) {
                    let answeredCount = draft.answers ? Object.keys(draft.answers).length : 0;
                    let qids = draft.question_ids || draft.questionIds || [];
                    let totalCount = qids.length;
                    
                    action = `
                        <div class="progress-box">${answeredCount}/${totalCount}</div>
                        <button class="continue-btn" onclick="continueQuiz('${ex.topic}')">Tiếp tục</button>
                        <button class="review-btn" onclick="restartQuiz('${ex.topic}')">Làm lại</button>`;
                } else if (stat.count == 0) {
                    action = `<button class="start-btn" onclick="goQuiz('${ex.topic}')">Bắt đầu</button>`;
                } else {
                    action = `<button class="review-btn" onclick="restartQuiz('${ex.topic}')">Làm lại</button>`;
                }

                html += `
                    <div class="exercise-item ${ex.is_general ? 'general-exam' : ''}">
                        <div class="exercise-info">
                            <div class="title">${displayTitle}</div>
                            <div class="meta">Tổng thời gian làm bài: ${stat.time} &nbsp;&nbsp; ${stat.count} lần nộp bài &nbsp;&nbsp; ${qCount} câu hỏi</div>
                        </div>
                        <div class="exercise-action">${action}</div>
                    </div>`;
            });
            
            document.getElementById("chapter-list").innerHTML = html;
            
            // Cập nhật trạng thái active cho nút môn học
            document.querySelectorAll(".subject").forEach(sub => sub.classList.remove("active"));
            const activeSub = document.getElementById(courseId);
            if (activeSub) activeSub.classList.add("active");
        }

        function getActiveCourse() {
            const activeSubject = document.querySelector(".subject.active");
            return activeSubject ? activeSubject.id : Object.keys(dynamicCourses)[0] || "TTHCM";
        }

        function goQuiz(topic) { window.location.href = "/quiz?topic=" + escapeTopic(topic); }

        function continueQuiz(topic) {
            const draft = getDraft(topic);
            if (!draft) {
                goQuiz(topic);
                return;
            }
            const qids = draft.question_ids || draft.questionIds || [];
            window.location.href = "/quiz?topic=" + escapeTopic(topic) + "&qids=" + encodeURIComponent(qids.join(","));
        }

        function restartQuiz(topic) {
            if (confirm("Bạn có chắc chắn muốn làm lại từ đầu? Mọi tiến trình cũ sẽ bị xóa.")) {
                clearDraft(topic);
                goQuiz(topic);
            }
        }

        function renderSubjects() {
            const subjectList = document.getElementById("subject-list");
            const courseIds = Object.keys(dynamicCourses);
            
            subjectList.innerHTML = courseIds.map(id => `
                <div id="${id}" class="subject" onclick="showChapters('${id}')">
                    <div class="subject-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                    <div class="subject-title">${id === 'TTHCM' ? 'Tư tưởng Hồ Chí Minh' : (id === 'CNXHKH' ? 'Chủ nghĩa xã hội khoa học' : id)}</div>
                </div>
            `).join('');
        }

        window.onload = function () { 
            renderSubjects();
            const firstCourse = Object.keys(dynamicCourses)[0] || "TTHCM";
            showChapters(firstCourse); 
            loadCloudDrafts(); // Gọi đồng bộ từ server
        }
        window.addEventListener("focus", function () { 
            loadCloudDrafts(); // Cập nhật lại mỗi khi quay lại tab
        });
    </script>

</body>
</html>
