version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alas_app
    ports:
      - "10000:10000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../static/img:/app/static/img
      - ../.env:/app/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    restart: always
